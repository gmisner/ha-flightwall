<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight Wall</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    background: #000;
  }
</style>
</head>
<body>
<img id="board" alt="Flight Wall" src="/local/flightwall-board.png">
<script>
  const img = document.getElementById("board");
  const src = "/local/flightwall-board.png";
  setInterval(function () {
    img.src = src + "?t=" + Date.now();
  }, 5000);
</script>
</body>
</html>
