# Flight Wall - popup automation
#
# Paste this into Settings -> Automations -> Create automation -> three-dot menu
# -> Edit in YAML. Do not add a leading "- " or an "automation:" key; the editor
# expects a single automation body.
#
# Requires: browser-mod, card-mod, stack-in-card (all via HACS).

alias: Flightwall Popup
description: Shows each aircraft once as it enters the zone
triggers:
  - trigger: state
    entity_id: sensor.flightwall_flight
    id: new
  - trigger: state
    entity_id: binary_sensor.flightwall_inbound
    to: "off"
    id: clear
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: clear
        sequence:
          - action: browser_mod.close_popup
      - conditions:
          - condition: template
            value_template: >
              {{ states('sensor.flightwall_flight') not in ['none','unknown','unavailable',''] }}
          - condition: template
            value_template: >
              {{ states('sensor.flightwall_flight') != states('input_text.flightwall_shown') }}
          - condition: time
            after: "07:00:00"
            before: "22:00:00"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.flightwall_shown
            data:
              value: "{{ states('sensor.flightwall_flight') }}"
          - action: rest_command.tablet_stop_screensaver
          - action: browser_mod.popup
            data:
              dismissable: true
              autoclose: false
              size: fullscreen
              timeout: 60000
              content:
                type: custom:stack-in-card
                mode: vertical
                card_mod:
                  style: |
                    ha-card {
                      background: transparent !important;
                      border: none !important;
                      border-radius: 0 !important;
                      box-shadow: none !important;
                      padding: 0 !important;
                      margin: 0 !important;
                    }
                cards:
                  - type: markdown
                    content: |
                      {% set f = state_attr('sensor.flightwall_flight','flight') %}
                      {% if f %}
                      {% macro clean(v, fb) %}{% set s = v | string | trim %}{{ fb if s in ['', 'None', 'none', 'null', 'N/A'] else s }}{% endmacro %}
                      {% set org = clean(f.airport_origin_code_iata, '') | trim %}
                      {% set dst = clean(f.airport_destination_code_iata, '') | trim %}
                      {% set orgc = clean(f.airport_origin_city, '') | trim %}
                      {% set dstc = clean(f.airport_destination_city, '') | trim %}
                      {% set iata = clean(f.airline_iata, '') | trim %}
                      {% set airline = clean(f.airline_short, '') | trim %}
                      {% set airlinel = clean(f.airline, '') | trim %}
                      {% set model = clean(f.aircraft_model, '') | trim %}
                      {% set code = clean(f.aircraft_code, '') | trim %}
                      {% set cs = clean(f.callsign, '') | trim %}
                      {% set reg = clean(f.aircraft_registration, '') | trim %}
                      {% set dep = (f.time_real_departure | default(0) | int(0)) or (f.time_scheduled_departure | default(0) | int(0)) %}
                      {% set arr = (f.time_estimated_arrival | default(0) | int(0)) or (f.time_scheduled_arrival | default(0) | int(0)) %}
                      {% set nw = as_timestamp(now()) | int %}
                      {% set d = nw - dep %}
                      {% set a = arr - nw %}
                      {% set prog = [[(((nw - dep) / ([arr - dep, 1] | max)) * 32) | round(0) | int, 0] | max, 32] | min %}
                      {% set alraw = airline if airline else airlinel %}
                      {% set al = alraw | truncate(22, true, '') | trim %}
                      ![]( https://images.kiwi.com/airlines/128/{{ iata | upper if iata else 'non-existing' }}.png )
                      ## {{ cs if cs else reg }}{% if al %} ({{ al }}){% endif %}

                      # {% if org and dst %}{{ org }}-{{ dst }}{% elif reg %}{{ reg }}{% else %}IN FLIGHT{% endif %}

                      ### {{ model if model else code }}

                      {% if dep > 0 and d > 0 %}DEPARTED {% if orgc %}{{ orgc }} {% endif %}{% if d >= 3600 %}{{ d // 3600 }}H {{ (d % 3600) // 60 }}M{% else %}{{ d // 60 }}M{% endif %} AGO{% else %}IN FLIGHT{% endif %}

                      {% if a > 0 %}ARRIVING {% if dstc %}{{ dstc }} {% endif %}IN {% if a >= 3600 %}{{ a // 3600 }}H {{ (a % 3600) // 60 }}M{% else %}{{ a // 60 }}M{% endif %}{% else %}EN ROUTE{% endif %}

                      {% if f.altitude is defined %}{{ "{:,}".format(f.altitude | int) | replace(",", ".") }} FT{% if f.ground_speed is defined %} · {{ f.ground_speed | int }} KT{% endif %}{% if f.distance is defined %} · {{ f.distance | round(1) }} KM{% endif %}{% endif %}

                      {{ '█' * prog }}{{ '░' * (32 - prog) }}
                      {% endif %}
                    card_mod:
                      style:
                        .: |
                          @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
                          ha-card {
                            position: fixed;
                            inset: 0;
                            height: 100vh;
                            width: 100vw;
                            border: none;
                            border-radius: 0;
                            background: #000;
                            box-shadow: none;
                            overflow: hidden;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            padding: 0;
                            z-index: 1;
                          }
                          ha-card::after {
                            content: "";
                            position: absolute;
                            inset: 0;
                            background-image: radial-gradient(circle at center,
                              rgba(0,0,0,0) 0 50%, #000 51% 100%);
                            background-size: 4px 4px;
                            pointer-events: none;
                            z-index: 5;
                          }
                        ha-markdown $: |
                          :host {
                            display: block;
                            width: 100%;
                            padding: 0 !important;
                          }
                          :host > * {
                            display: grid;
                            grid-template-columns: min(34vw, 48vh) minmax(0, auto);
                            grid-template-rows: repeat(6, auto);
                            align-items: center;
                            justify-content: center;
                            column-gap: min(3vw, 4.5vh);
                            width: 100%;
                          }
                          h1, h2, h3, p {
                            font-family: 'Press Start 2P', monospace !important;
                            color: #ffffff !important;
                            text-shadow:
                              0.04em 0 0 currentColor,
                              0 0.04em 0 currentColor,
                              0.04em 0.04em 0 currentColor !important;
                            text-transform: uppercase;
                            letter-spacing: .06em;
                            line-height: 1.25 !important;
                            text-align: left;
                            border: none !important;
                            grid-column: 2;
                            -webkit-font-smoothing: none;
                            font-smooth: never;
                            margin: 0 0 2.2vh 0 !important;
                            padding: 0 !important;
                          }
                          p:first-of-type {
                            grid-column: 1;
                            grid-row: 1 / span 6;
                            margin: 0 !important;
                            text-shadow: none !important;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                          }
                          p:first-of-type img {
                            width: min(32vw, 46vh);
                            max-height: min(32vw, 46vh);
                            object-fit: contain;
                            image-rendering: auto;
                            filter: brightness(1.15) saturate(1.4) contrast(1.1);
                          }
                          h2 { font-size: min(4.2vw, 5.8vh) !important; color: #9fb8e8 !important; }
                          h1 { font-size: min(12vw, 18vh) !important; }
                          h3 { font-size: min(4vw, 5.6vh) !important; color: #7ea6ff !important; }
                          p  { font-size: min(3.3vw, 4.7vh) !important; color: #ffffff !important; }
                          p:last-of-type {
                            font-family: monospace !important;
                            font-size: min(2.8vw, 4vh) !important;
                            letter-spacing: 0 !important;
                            color: #35ff7a !important;
                            -webkit-text-fill-color: #35ff7a !important;
                            margin: 3vh 0 0 0 !important;
                            text-shadow: none !important;
                            font-weight: normal !important;
                            line-height: 1 !important;
                          }
                  - type: button
                    name: ×
                    show_name: true
                    show_icon: false
                    tap_action:
                      action: call-service
                      service: browser_mod.close_popup
                    card_mod:
                      style: |
                        :host {
                          position: fixed !important;
                          top: 2.5vh !important;
                          right: 2.5vh !important;
                          width: 6vh !important;
                          height: 6vh !important;
                          z-index: 50 !important;
                          display: block !important;
                        }
                        ha-card {
                          width: 100% !important;
                          height: 100% !important;
                          min-height: 0 !important;
                          background: transparent !important;
                          border: none !important;
                          border-radius: 0 !important;
                          box-shadow: none !important;
                          padding: 0 !important;
                          margin: 0 !important;
                          display: flex !important;
                          align-items: center !important;
                          justify-content: center !important;
                          cursor: pointer;
                        }
                        ha-card span,
                        ha-card .name,
                        ha-card div {
                          font-family: monospace !important;
                          font-size: 4vh !important;
                          font-weight: 300 !important;
                          color: rgba(255,255,255,.28) !important;
                          line-height: 1 !important;
                        }
mode: restart
max_exceeded: silent
